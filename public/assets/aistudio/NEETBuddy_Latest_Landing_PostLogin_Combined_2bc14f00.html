ok','ib']].map(a=>`<button class="card" style="font-weight:700;text-align:center" onclick="go('${a[2]}')"><div style="font-size:26px">${a[1]=='x'?'':a[0]}</div>${a[1]}</button>`).join('')}</div>`,bc(['Performance'])):'',

function start(mode,src,cnt){const n=cnt||(mode=='mock'?20:Math.min(S.cnt,20)),l=Array.from({length:n},(_,i)=>QS[i%8]);Q={mode,src,l,i:0,a:[],m:[],end:Date.now()+(cnt?Math.max(10,Math.round(n*1.5)):(mode=='mock'?30:S.cnt))*60000,t0:Date.now()};S.v='quiz';draw();scrollTo(0,0)}
function tick(){const e=$('#tm');if(!e||!Q)return;const s=Math.max(0,Math.round((Q.end-Date.now())/1000));e.textContent='⏱ '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)finish()}
function score(){let c=0,w=0;Q.l.forEach((q,i)=>{if(Q.a[i]==null)return;Q.a[i]==q.a?c++:w++});return{c,w,at:c+w,acc:c+w?Math.round(c/(c+w)*100):0}}
function finish(){clearInterval(TM);if(Q.src){const r=score();if(Q.src.startsWith('py:'))PYD[Q.src.slice(3)]=r.acc;if(Q.src.startsWith('dpp:')){const k=dk();DPPD[k]=DPPD[k]||{};DPPD[k][Q.src.slice(4)]=1}svx()}Q.l.forEach((q,i)=>{if(Q.a[i]!=null&&Q.a[i]!=q.a)IB.unshift([q.q,'Physics','Units & Dimensions','Kinematics','Incorrect','Today'])});go('result');if(score().acc>=80)confetti()}
function draw(){clearInterval(TM);$('#app').innerHTML=V[S.v]();if(S.v=='quiz'){tick();TM=setInterval(tick,1000)}}
